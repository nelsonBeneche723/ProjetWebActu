{% extends "base.html" %}
{% block content %}

<style>
  body {
    background:white;
  }
</style>
<div style="max-width:420px;margin:40px auto;padding:0 16px;text-align:center;">
  <h2 style="color:gray;">Soutenez Actu Web Media</h2>
  <p style="color:gray;">Votre don nous aide à garder le site gratuit et à produire plus de contenu.</p>

  {% if paypal_client_id %}
    <label for="montant" style="display:block;margin-bottom:8px; color:gray;">Choisissez un montant :</label>
    <select id="montant" style="padding:8px;margin-bottom:16px;">
      <option value="5">5 $</option>
      <option value="10" selected>10 $</option>
      <option value="25">25 $</option>
      <option value="50">50 $</option>
    </select>

    <div id="paypal-button-container"></div>
    <p id="message-don" style="margin-top:16px;font-weight:600;"></p>

    <script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>
    <script>
      paypal.Buttons({
        style: { layout: "vertical", color: "gold", shape: "pill", label: "donate" },

        createOrder: function (data, actions) {
          return actions.order.create({
            purchase_units: [{
              description: "Don - Actu Web Media",
              amount: { value: document.getElementById("montant").value }
            }]
          });
        },

        onApprove: function (data, actions) {
          return actions.order.capture().then(function (details) {
            document.getElementById("message-don").textContent =
              "Merci " + details.payer.name.given_name + " pour votre don !";
          });
        },

        onError: function () {
          document.getElementById("message-don").textContent =
            "Une erreur est survenue. Réessayez.";
        }
      }).render("#paypal-button-container");
    </script>
  {% else %}
    <p>Les dons ne sont pas disponibles pour le moment.</p>
  {% endif %}
</div>
{% endblock %}
