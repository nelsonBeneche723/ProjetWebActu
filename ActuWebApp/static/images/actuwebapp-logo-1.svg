<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB199"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with play triangle + soundwave bars -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#iconGrad)"/>

    <!-- soundwave bars -->
    <g fill="#FFFFFF" opacity="0.9">
      <rect x="34" y="86" width="10" height="34" rx="5"/>
      <rect x="52" y="70" width="10" height="66" rx="5"/>
      <rect x="70" y="50" width="10" height="106" rx="5"/>
    </g>

    <!-- play triangle -->
    <path d="M96 56 L132 100 L96 144 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(210,0)" font-family="Helvetica, Arial, sans-serif">
    <text x="0" y="118" font-size="72" font-weight="700" fill="#1B2A4A">Actu<tspan fill="#E63946">Web</tspan></text>
    <text x="4" y="152" font-size="20" font-weight="500" letter-spacing="3" fill="#5C6B85">MUSIQUE &amp; MÉDIAS HAÏTIENS</text>
  </g>
</svg>
